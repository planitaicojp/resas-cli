version: 2

builds:
  - binary: resas
    ldflags:
      - -s -w -X github.com/planitaicojp/resas-cli/cmd.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

brews:
  - repository:
      owner: planitaicojp
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    name: resas
    homepage: "https://github.com/planitaicojp/resas-cli"
    description: "CLI tool for RESAS (Regional Economic Analysis System) API"
    license: "MIT"
    install: |
      bin.install "resas"

scoops:
  - repository:
      owner: planitaicojp
      name: bucket
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    name: resas
    homepage: "https://github.com/planitaicojp/resas-cli"
    description: "CLI tool for RESAS (Regional Economic Analysis System) API"
    license: "MIT"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
